name: hermes-agent-cluster
version: 3.2.0
description: "Distributed Kanban cluster extension — multi-node task coordination via Python FastAPI server. #893: the Hermes plugin resolves the cluster-main endpoint from cluster config (remote-capable), so a worker lane can dispatch its own reviewer."
author: "Heventure Group"
hooks:
  - on_session_start
  - on_session_end
pip_dependencies:
  - fastapi
  - uvicorn
