cluster:
  id: bdaya_hermes_cluster
  role: main
  token: ""

node:
  id: windows_desktop_main
  name: windows-desktop-main
  capabilities:
    - planning
    - reviewing
    - scheduling
    - tooling

server:
  bind: "0.0.0.0"
  port: 8787
  tls:
    enabled: false

lease:
  ttl: 60s
  scan_rate: 10s

watchdog:
  check_interval: 5s
  degraded_after: 15s
  offline_after: 30s

heartbeat:
  interval: 30s
  lease_timeout: 120s

reconnect:
  initial_interval: 1s
  max_interval: 60s
  multiplier: 2.0

federation:
  enabled: true
  ping_interval: 30s
  token: ""

# Cluster state store (#829). Default: SQLite at store.db_path (local/dev).
# For the shared Postgres store, set backend: postgres and provide the DSN
# via the environment (NEVER in this file):
#   store:
#     backend: postgres
#     dsn_env: HERMES_CLUSTER_PG_DSN   # env var holding the asyncpg DSN
# One-shot migration from an existing SQLite cluster.db:
#   python -m hermes_cluster.tools.import_sqlite --db path/to/cluster.db

# Alibaba Token Plan metering (main node). This file seeds an EMPTY runtime
# store once (intake precedent); afterwards the runtime config is
# authoritative and changes go through PUT /api/v1/config without a redeploy.
# The AK/SK are NEVER here and NEVER in env vars — the poller reads
# bdaya-website/alibaba-ram-metering-access-key-id(+secret) from GCP Secret
# Manager at startup via Workload Identity. Credentials/endpoint host may be
# overridden here only for non-default deployments.
metering:
  enabled: false        # arm the poller (fetch every interval_s, alert)
  interval_s: 900       # poll cadence (seconds)
  alert_below: 25000    # total surplus credits -> hook alert (TASK_FAILED,
                        # payload source="metering" -> Telegram bot)
  fail_threshold: 3     # consecutive fetch failures before an alert
