cluster:
  id: bdaya_hermes_cluster
  role: worker
  endpoint: "http://100.107.212.67:8787"
  token: ""

node:
  id: windows_pc_worker
  name: windows-pc-worker
  capabilities:
    - tooling
    - planning
  # #867: probe-gated capability — declared ONLY while this node can mint a
  # bdaya-lane-agent App installation token (key hydrated to
  # ~/.config/bdaya/lane-agent-app.pem via lane_gh_token.py hydrate-key).
  # A task `requires: [github-write]` will not dispatch here until the probe
  # exits 0, so a missing credential is loud at dispatch, not silent mid-lane.
  capability_probes:
    github-write:
      command: ["C:/Users/ahmed/hermes-cluster/.venv/Scripts/python.exe",
                "C:/Users/ahmed/hermes-cluster/scripts/gh-write-doctor.py", "--no-post"]
      interval_s: 300

server:
  bind: "0.0.0.0"
  port: 8788

lease:
  ttl: 60s
  scan_rate: 10s

watchdog:
  check_interval: 5s
  degraded_after: 15s
  offline_after: 30s

heartbeat:
  interval: 30s
  lease_timeout: 120s

store:
  db_path: "cluster-worker.db"

agent_executor:
  enabled: true
  # worker mode: "bdaya-dispatch" (default) or native "hermes"
  worker: bdaya-dispatch
  profile: alibaba1
  model: qwen3.7-plus
  # only used in hermes worker mode: `hermes -p <hermes_profile> chat --query-file ...`
  hermes_profile: default
  hermes_bin: ""
  # reviewer role passes -m <hermes_reviewer_model> (opus tier) so the merge
  # gate accepts its verdicts; author lanes use the profile default (no -m).
  hermes_reviewer_model: "qwen3.7-plus"
  poll_interval: 15
  max_concurrent: 1
  spawn_timeout: 1800
